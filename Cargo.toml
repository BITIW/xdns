[package]
name = "xdns"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
hickory-proto = "0.24"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.9"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
